name: Docbench review fix

on:
  push:
    branches:
      - feat/docbench-filename
    paths:
      - .github/workflows/docbench-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("benches/docbench/public/document-enhancements.mjs")
          source = path.read_text(encoding="utf-8")
          old = '''function commitFilenameEdit() {
            const previous = state.filename;
            const next = filenameLabel.textContent.trim().replace(/[\\\\/:*?"<>|]/g, "-");
            const fallback = `untitled.${preferredExtension[formatSelect.value]}`;
            state.filename = next || fallback;
            filenameLabel.textContent = state.filename;
            if (state.filename !== previous && state.handle) state.handle = null;
            formatSelect.value = formatFromFilename(state.filename);
            updateFormatButton();
            updateSaveButton();
            updateMeta();
          }'''
          new = '''function commitFilenameEdit() {
            const previousFilename = state.filename;
            const previousFormat = formatSelect.value;
            const next = filenameLabel.textContent.trim().replace(/[\\\\/:*?"<>|]/g, "-");
            const fallback = `untitled.${preferredExtension[formatSelect.value]}`;
            state.filename = next || fallback;
            filenameLabel.textContent = state.filename;

            const filenameChanged = state.filename !== previousFilename;
            const nextFormat = formatFromFilename(state.filename);
            const formatChanged = nextFormat !== previousFormat;
            if (filenameChanged || formatChanged) state.documentRevision += 1;
            if (filenameChanged) state.handle = null;

            formatSelect.value = nextFormat;
            updateFormatButton();
            updateSaveButton();
            updateMeta();
            if (formatChanged) schedulePreview(0);
          }'''
          if old not in source:
              raise SystemExit("Expected commitFilenameEdit block not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Validate and commit
        run: |
          node --check benches/docbench/public/document-enhancements.mjs
          rm .github/workflows/docbench-review-fix.yml
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add benches/docbench/public/document-enhancements.mjs .github/workflows/docbench-review-fix.yml
          git commit -m 'fix(docbench): harden filename edits'
          git push
